[package]
name = "uranium-rs"
version = "1.0.4"
authors = ["sergious234 <sergious23@gmail.com>"]
edition = "2024"
description = "Lib for downloading/making minecraft and modpacks"
license = "GPL-2.0"
keywords = ["minecraft"]
repository = "https://github.com/sergious234/uranium-rs"
exclude = ["tests/data/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# serde = { version = "1.0.183", features = ["derive"] }
reqwest = { version = "0.12.22", features = ["json", "stream"] }
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3.31"
mine_data_structs = {version="1.0.12", features = ["serde"]}
sha1 = "0.10.5"
zip = {version="2.1.5", features=["deflate"]}
chrono = "0.4.38"
thiserror = "1.0.40"
simplelog = "0.12.1"
log = { version = "0.4.19", features = ["std"] }
rayon = "1.10.0"
dirs = "5.0.1"
walkdir = "2.5.0"
rrhodium = "1.0.0"
miniserde = "0.1.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"

[features]
integration-tests = []

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"

[[test]]
name = "maker"
path = "tests/maker.rs"

[[test]]
name = "rinth_installer"
path = "tests/rinth_installer.rs"

[[test]]
name = "rinth_loader"
path = "tests/rinth_loader.rs"

[[test]]
name = "rinth_vanilla_progress"
path = "tests/rinth_vanilla_progress.rs"

[[test]]
name = "minecraft_progress"
path = "tests/minecraft_progress.rs"

[[test]]
name = "runtime"
path = "tests/runtime_downloader.rs"

[[test]]
name = "installation_verification"
path = "tests/installation_verification.rs"

# [[bench]]
# name = "verification"
# path = "benches/verification.rs"
# harness = false
# 
# [[bench]]
# name = "download"
# path = "benches/download.rs"
# harness = false
